# tmux — multiplexer; colours in colors.conf (themes/<t>/tmux overlays it)
# https://github.com/tmux/tmux/wiki

# Plugins
set -g @plugin "tmux-plugins/tpm"
set -g @plugin "tmux-plugins/tmux-resurrect"
set -g @plugin "tmux-plugins/tmux-continuum"

# Session persistence: resurrect saves with C-a C-s (restore C-a C-r);
# continuum auto-saves every 15 minutes and restores on tmux start.
set -g @continuum-save-interval '15'
set -g @continuum-restore 'on'

# TPM init (plugins live in ~/.config/tmux/plugins/)
run "~/.config/tmux/plugins/tpm/tpm"

# General (true colour comes from kitty's own terminfo, xterm-kitty)
set -g default-terminal "tmux-256color"

unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix

set -g mouse              on
set -g focus-events       on   # lets nvim's autoread see files changed outside
set -g base-index         1
set -g renumber-windows   on
set -g history-limit      10000
set -g detach-on-destroy  off

# Keybindings
bind r source-file ~/.config/tmux/tmux.conf \; display "Config reloaded"

# Sessions and windows
bind s new-session
bind w new-window -c "#{pane_current_path}"
bind t choose-tree -s

# Termination
bind S confirm-before -p "Kill session #S? (y/n)" kill-session
bind W confirm-before -p "Kill window #W? (y/n)" kill-window
bind P confirm-before -p "Kill pane #P? (y/n)" kill-pane

# Splitting
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# Navigation
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Resizing
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Alt+number for quick window switching
bind-key -n M-1 select-window -t 1
bind-key -n M-2 select-window -t 2
bind-key -n M-3 select-window -t 3
bind-key -n M-4 select-window -t 4
bind-key -n M-5 select-window -t 5
bind-key -n M-6 select-window -t 6
bind-key -n M-7 select-window -t 7
bind-key -n M-8 select-window -t 8
bind-key -n M-9 select-window -t 9

# Window swapping (Alt+h/l)
bind-key -n M-h  swap-window -d -t -1
bind-key -n M-l  swap-window -d -t +1

# Appearance
set -g status on
set -g status-interval 1
set -g status-position top
set -g status-justify left

set -g pane-border-lines        single
set -g pane-border-status       top
set -g pane-border-format       " #{pane_index} #{pane_current_command} "

# Status left
set -g status-left-length 40

# Status right
set -g status-right-length 80

# Windows
setw -g window-status-separator ""

# Colours of the active theme (themes/<t>/tmux/colors.conf overlays the base)
source-file ~/.config/tmux/colors.conf
