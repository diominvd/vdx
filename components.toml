# components — what the installer can put on a machine: one entry, one checkbox
#
# A component is a dotfiles package, an optional feature or a piece of hardware.
# Which are on: [components] selected in .machine.toml (`./install.py components`);
# without it every component is on except hardware that wasn't detected.
#
#   group        wizard screen: core (always on, hidden), desktop, terminal, editor,
#                apps, music, network, ai, personal, hardware
#   about        one line for the wizard
#   default      on for a new machine (default true; hardware: when `auto` holds)
#   requires     components switched on with this one, which can't be switched off
#   suggests     components ticked along with this one, which can be unticked
#   auto         hardware only: every term must hold — gpu:<vendor>, hybrid, laptop,
#                asus, quirk:<name>; !term negates (`./install.py machine`)
#   pacman, aur  packages; a name may be shared by several components
#   links        paths under packages/ (or home/...); the longest one that matches a
#                file owns it, theme overlays follow their package
#   submodules   initialised only when the component is on
#   modules      the shell's bar modules it brings (shown "not installed" without it)
#   system       files under system/ (copied into / by `system install`)
#   services, user_services   systemd units to enable (system / --user)
#   user_units   unit files (repo paths) copied into ~/.config/systemd/user
#   masks        system units masked (they fight a service of this component)
#   secrets      keys of private/manifest.json it uses
#   hint         a manual step printed, never done (boot loader, initramfs, ...)
#   split_from   a component it was split off (and requires): on wherever that one
#                is, unless [components] off in .machine.toml names it

# ---- core ----

[core]
group = "core"
about = "What the installer itself needs"
pacman = ["git", "python", "uv", "curl", "jq", "base-devel"]
aur = ["yay"]
secrets = ["secrets/env"]

# ---- desktop ----

[hypr]
group = "desktop"
about = "Hyprland: the compositor, its binds, rules and window modes"
suggests = ["quickshell", "mako", "gtk", "kitty"]
pacman = ["hyprland", "xdg-desktop-portal-hyprland", "xdg-desktop-portal-gtk",
          "pipewire", "pipewire-pulse", "wireplumber", "grim", "slurp", "wl-clipboard"]
links = ["hypr"]
user_services = ["pipewire.socket", "pipewire-pulse.socket", "wireplumber.service"]

[quickshell]
group = "desktop"
about = "The shell: bar, popups, launcher, Shell Manager and its apps"
requires = ["hypr"]
suggests = ["mako", "gtk"]
pacman = ["quickshell", "pipewire-audio", "python-gobject", "xdg-desktop-portal", "udisks2", "ffmpegthumbnailer", "poppler", "awww", "hyprsunset", "brightnessctl", "gpu-screen-recorder", "wiremix",
          "libpulse", "bluez", "bluez-utils", "networkmanager", "libnotify", "upower",
          "glib2", "fd", "xdg-utils", "ttf-jetbrains-mono-nerd", "cava",
          "dnsmasq", "iw"]
links = ["quickshell", "xdg-portal"]
modules = ["workspaces", "clock", "equalizer", "themes", "mode", "wallpapers", "brightness", "audio", "wifi", "bluetooth", "battery", "language", "shell",
           "notifications", "capture", "clipboard", "sysmon", "taskmanager", "tray",
           "display", "windows", "folder", "music", "focus", "timer", "media"]
system = ["etc/polkit-1/rules.d/50-pkexec-keep.rules"]
services = ["NetworkManager.service", "bluetooth.service"]

# parts of the shell that can stay off: their files are linked with quickshell
# (shell.qml imports them), only their bar module, app and packages go
[shell-backups]
group = "desktop"
about = "Backups in the shell: restic snapshots, Back up, restore"
requires = ["quickshell"]
split_from = "quickshell"
pacman = ["restic"]
modules = ["backup"]

[shell-cleaner]
group = "desktop"
about = "Cleaner in the shell: caches and old packages, the safe part in one click"
requires = ["quickshell"]
split_from = "quickshell"
pacman = ["pacman-contrib"]
modules = ["cleaner"]

[shell-packages]
group = "desktop"
about = "Packages in the shell: pending updates, one click to update"
requires = ["quickshell"]
split_from = "quickshell"
pacman = ["pacman-contrib"]
modules = ["packages"]

[mako]
group = "desktop"
about = "Notifications, in the theme's colours"
pacman = ["mako"]
links = ["mako"]

[gtk]
group = "desktop"
about = "GTK 3 colours and the system monospace font"
pacman = ["ttf-jetbrains-mono-nerd"]
links = ["gtk-3.0", "fontconfig"]

# ---- terminal ----

[kitty]
group = "terminal"
about = "kitty, the terminal"
pacman = ["kitty"]
links = ["kitty"]

[zsh]
group = "terminal"
about = "zsh with Oh My Zsh, its plugins and the Starship prompt"
pacman = ["zsh", "starship", "eza", "fzf"]
links = ["zsh", "starship", "home/.zshenv"]

[tmux]
group = "terminal"
about = "tmux with TPM"
pacman = ["tmux"]
links = ["tmux"]

[btop]
group = "terminal"
about = "btop, the resource monitor"
pacman = ["btop"]
links = ["btop"]

[fastfetch]
group = "terminal"
about = "fastfetch, the system summary"
pacman = ["fastfetch"]
links = ["fastfetch"]

[gh]
group = "terminal"
about = "GitHub CLI"
pacman = ["github-cli"]
links = ["gh"]
secrets = ["gh/hosts.yml"]

[lazygit]
group = "terminal"
about = "lazygit, the git TUI"
pacman = ["lazygit"]

[scripts]
group = "terminal"
about = "Small helpers: battery, disk, memory, volume, colorpaper"
requires = ["zsh"]
links = ["scripts/battery.sh", "scripts/disk.sh", "scripts/memory.sh", "scripts/colorpaper",
         "zsh/functions/battery", "zsh/functions/disk", "zsh/functions/memory", "zsh/functions/volume"]

# ---- editor ----

[nvim]
group = "editor"
about = "Neovim with LSP, Mason, DAP and AI plugins"
suggests = ["lazygit"]
pacman = ["neovim", "tree-sitter-cli", "ripgrep", "fd", "base-devel", "unzip", "nodejs", "npm"]
submodules = ["packages/nvim"]
links = ["nvim"]

# ---- apps ----

[elio]
group = "apps"
about = "elio, the terminal file manager"
default = false
aur = ["elio"]
links = ["elio"]

[telegram]
group = "apps"
about = "Telegram Desktop and its theme"
default = false
aur = ["telegram-desktop-bin"]
links = ["telegram"]

[virustotal]
group = "apps"
about = "VirusTotal lookups in the shell (needs an API key)"
default = false
requires = ["quickshell"]
modules = ["virustotal"]

# ---- music ----

[mpd]
group = "music"
about = "MPD, mpc and ncmpcpp; the Music module's Files source"
default = false
pacman = ["mpd", "mpc", "ncmpcpp"]
links = ["mpd", "ncmpcpp"]
user_services = ["mpd.service"]
modules = ["files"]

[yandex-music]
group = "music"
about = "Yandex Music likes in MPD: the `music` command and the Yandex Music source of the Music module"
default = false
requires = ["mpd"]
submodules = ["packages/scripts/yandex-music"]
links = ["scripts/yandex-music", "zsh/functions/music", "quickshell/shell/scripts/yandex.py"]
modules = ["yandex"]
secrets = ["yandex-music/token"]

[radio]
group = "music"
about = "Internet radio in MPD: the `radio` command and the radio source of the Music module"
default = false
requires = ["mpd"]
submodules = ["packages/scripts/radio"]
links = ["scripts/radio", "zsh/functions/radio"]
modules = ["radio", "tuner"]

# ---- network ----

[vpn]
group = "network"
about = "Mihomo proxy, mihomo-tui and the `vpn` command"
default = false
aur = ["mihomo-bin", "mihomo-tui-bin"]
submodules = ["packages/scripts/vpn"]
links = ["mihomo", "mihomo-tui", "scripts/vpn", "zsh/functions/vpn"]
modules = ["mihomo"]
system = ["etc/pacman.d/hooks/mihomo-caps.hook"]
user_units = ["packages/scripts/vpn/mihomo.service"]
user_services = ["mihomo.service"]
secrets = ["mihomo/subscriptions.json"]

[wifitui]
group = "network"
about = "wifitui, a Wi-Fi TUI"
default = false
aur = ["wifitui"]

# ---- ai ----

[ollama]
group = "ai"
about = "Local models with Ollama (the nvim habit coach, the AI module)"
default = false
pacman = ["ollama"]
modules = ["ai"]
system = ["etc/polkit-1/rules.d/50-ollama.rules"]

[claude-code]
group = "ai"
about = "Claude Code (its limits in the AI module, the cleaner's AI mode)"
default = false
aur = ["claude-code"]
modules = ["ai"]

[codex]
group = "ai"
about = "Codex CLI (its limits in the AI module)"
default = false
pacman = ["openai-codex"]
modules = ["ai"]

[opencode]
group = "ai"
about = "opencode, and the bar's chat with its free models"
default = false
pacman = ["opencode"]
links = ["opencode"]
modules = ["chat"]
secrets = ["opencode/service.json"]

# ---- personal ----

[private]
group = "personal"
about = "Restore secret files from the private repo (private/)"
default = false

[airpods]
group = "personal"
about = "AirPods over Bluetooth: no adapter autosuspend, no ERTM, AAC that adapts to the link"
default = false
pacman = ["libfdk-aac"]
links = ["wireplumber"]
system = ["etc/modprobe.d/btusb-airpods.conf", "etc/bluetooth/main.conf"]

# ---- hardware ----

[gpu-intel]
group = "hardware"
about = "Intel graphics: VA-API and Vulkan"
auto = ["gpu:intel"]
pacman = ["intel-media-driver", "vulkan-intel"]

[gpu-amd]
group = "hardware"
about = "AMD graphics: VA-API and Vulkan"
auto = ["gpu:amd"]
pacman = ["mesa", "vulkan-radeon"]

[gpu-nvidia]
group = "hardware"
about = "NVIDIA graphics: utilities"
auto = ["gpu:nvidia"]
pacman = ["nvidia-utils"]
hint = """the kernel driver is yours to pick: nvidia-open (linux) or nvidia-open-dkms (other kernels);
then `options nvidia-drm modeset=1` in /etc/modprobe.d, nvidia nvidia_modeset nvidia_uvm nvidia_drm
in MODULES of /etc/mkinitcpio.conf, `sudo mkinitcpio -P`, reboot"""

[nvidia-only]
group = "hardware"
about = "NVIDIA as the only GPU: video decoding on it (VA-API) and its Hyprland env"
auto = ["gpu:nvidia", "!hybrid"]
pacman = ["libva-nvidia-driver"]

[nvidia-laptop]
group = "hardware"
about = "NVIDIA dGPU of a hybrid laptop sleeps when unused (runtime PM)"
auto = ["gpu:nvidia", "hybrid", "laptop"]
system = ["etc/modprobe.d/nvidia-pm.conf"]

[laptop]
group = "hardware"
about = "Battery: TLP, the charge limit and power profiles from the bar"
auto = ["laptop"]
pacman = ["tlp", "tlp-rdw"]
system = ["etc/tlp.d/99-dotfiles.conf", "etc/tmpfiles.d/quickshell-power.conf", "etc/udev/rules.d/90-quickshell-power.rules"]
services = ["tlp.service"]
masks = ["systemd-rfkill.service", "systemd-rfkill.socket"]

[asus]
group = "hardware"
about = "ASUS hybrid graphics: supergfxctl (switch the dGPU off)"
auto = ["asus", "hybrid"]
aur = ["supergfxctl"]
services = ["supergfxd.service"]

[asus-fx516pm-headset-mic]
group = "hardware"
about = "Headset mic on the ALC294 combo jack (ASUS TUF Dash F15 only)"
auto = ["quirk:asus-fx516pm-headset-mic"]
system = ["etc/tmpfiles.d/headset-mic.conf"]
